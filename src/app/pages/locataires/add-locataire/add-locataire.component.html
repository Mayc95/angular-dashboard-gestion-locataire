<app-component-card title="Ajouter un locataire">
  <div class="">
    @if (showLoading()) {
      <div
        class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-slate-950/40 backdrop-blur-md"
      >
        <!-- Conteneur blanc épuré avec des ombres douces -->
        <div
          class="flex flex-col items-center p-8 rounded-2xl bg-white shadow-2xl border border-slate-100/80"
        >
          <!-- Rail de guidage (Un gris plus prononcé pour un meilleur contraste) -->
          <div
            class="relative w-64 h-2.5 bg-slate-200 rounded-full overflow-hidden"
          >
            <!-- La bille indigo avec un effet de lueur (glow) -->
            <div
              class="absolute top-0 bottom-0 w-14 bg-indigo-600 rounded-full shadow-[0_0_12px_rgba(79,70,229,0.5)] animate-ping-pong"
            ></div>
          </div>

          <!-- Texte retravaillé : police semi-bold et espacement lettrage -->
          <span
            class="mt-5 text-sm font-semibold text-slate-700 tracking-wider animate-pulse"
          >
            Chargement en cours...
          </span>
        </div>
      </div>
    } @else {
      @if (error()) {
        <div>
          <app-alert variant="error" [message]="errorMessage()"></app-alert>
        </div>
      }

      <div>
        <div
          class="w-full flex flex-col gap-1 justify-center items-center mb-4"
        >
          <div class="p-2">
            @if (photoProfilPreview) {
              <img class="p-1 w-[100px] h-[100px]" [src]="photoProfilPreview" />
            } @else {
              <h2>Aucune image selectionner</h2>
            }
          </div>
          <app-label for="photoprofil">Photo de profil</app-label>
          <!-- Accepts image files (png,.jpg,.jpeg) -->
          <input
            id="photoprofil"
            name="photoprofil"
            type="file"
            accept=".png,.jpg,.jpeg"
            (change)="onChangePhotoProfil($event)"
          />
        </div>

        <div class="flex justify-between gap-2 mb-3">
          <div class="w-1/2">
            <app-label for="nom">Nom</app-label>
            <app-input-field
              type="text"
              id="nom"
              [(value)]="newLocataire.nom"
            />
          </div>
          <div class="w-1/2">
            <app-label for="prenoms">Prenoms</app-label>
            <app-input-field
              type="text"
              id="prenoms"
              [(value)]="newLocataire.prenoms"
            />
          </div>
        </div>

        <div class="flex justify-between gap-2 mb-3">
          <div class="w-1/2">
            <app-label for="phone">Telephone</app-label>
            <app-input-field
              type="text"
              id="phone"
              [(value)]="newLocataire.phone"
            />
          </div>
          <div class="w-1/2">
            <app-label for="input">Adresse mail</app-label>
            <div class="relative">
              <span
                class="absolute left-0 top-1/2 -translate-y-1/2 border-r border-gray-200 px-3.5 py-3 text-gray-500 dark:border-gray-800 dark:text-gray-400"
              >
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 20 20"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    fill-rule="evenodd"
                    clip-rule="evenodd"
                    d="M3.04175 7.06206V14.375C3.04175 14.6511 3.26561 14.875 3.54175 14.875H16.4584C16.7346 14.875 16.9584 14.6511 16.9584 14.375V7.06245L11.1443 11.1168C10.457 11.5961 9.54373 11.5961 8.85638 11.1168L3.04175 7.06206ZM16.9584 5.19262C16.9584 5.19341 16.9584 5.1942 16.9584 5.19498V5.20026C16.9572 5.22216 16.946 5.24239 16.9279 5.25501L10.2864 9.88638C10.1145 10.0062 9.8862 10.0062 9.71437 9.88638L3.07255 5.25485C3.05342 5.24151 3.04202 5.21967 3.04202 5.19636C3.042 5.15695 3.07394 5.125 3.11335 5.125H16.8871C16.9253 5.125 16.9564 5.15494 16.9584 5.19262ZM18.4584 5.21428V14.375C18.4584 15.4796 17.563 16.375 16.4584 16.375H3.54175C2.43718 16.375 1.54175 15.4796 1.54175 14.375V5.19498C1.54175 5.1852 1.54194 5.17546 1.54231 5.16577C1.55858 4.31209 2.25571 3.625 3.11335 3.625H16.8871C17.7549 3.625 18.4584 4.32843 18.4585 5.19622C18.4585 5.20225 18.4585 5.20826 18.4584 5.21428Z"
                    fill="#667085"
                  ></path>
                </svg>
              </span>
              <app-input-field
                placeholder="info@gmail.com"
                type="email"
                className="pl-[62px]"
                [(value)]="newLocataire.email"
              />
            </div>
          </div>
        </div>

        <div class="flex justify-between gap-2 mb-3">
          <div class="w-1/2">
            <app-label> Appartement</app-label>
            <app-select
              [options]="listAppartementsOptions()"
              [placeholder]="
                showLoadingListAppartements()
                  ? 'Chargement liste des appartement...'
                  : listAppartementsOptions().length > 0
                    ? 'Selectionner un appartement'
                    : 'Aucun appartement disponible'
              "
              (valueChange)="handleSelectAppartementChange($event)"
              className="dark:bg-dark-900"
              [disabled]="showLoadingListAppartements()"
            />
          </div>
        </div>

        <div class="flex justify-between gap-2 mb-3">
          <div class="flex items-center justify-end w-full gap-3 mt-8">
            <app-button
              size="sm"
              variant="outline"
              (click)="router.navigate(['/locataires'])"
            >
              Retour a la liste
            </app-button>
            <app-button size="sm" (click)="onAddLocataire()">
              Ajouter
            </app-button>
          </div>
        </div>
      </div>
    }
  </div>
</app-component-card>
