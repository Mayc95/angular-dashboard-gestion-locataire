<app-component-card title="Enregistrer un paiement de loyer">
  <div class="">
    @if (showLoading()) {
    <div
        class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-slate-950/40 backdrop-blur-md"
      >
        <!-- Conteneur blanc épuré avec des ombres douces -->
        <div
          class="flex flex-col items-center p-8 rounded-2xl bg-white shadow-2xl border border-slate-100/80"
        >
          <!-- Rail de guidage (Un gris plus prononcé pour un meilleur contraste) -->
          <div
            class="relative w-64 h-2.5 bg-slate-200 rounded-full overflow-hidden"
          >
            <!-- La bille indigo avec un effet de lueur (glow) -->
            <div
              class="absolute top-0 bottom-0 w-14 bg-indigo-600 rounded-full shadow-[0_0_12px_rgba(79,70,229,0.5)] animate-ping-pong"
            ></div>
          </div>

          <!-- Texte retravaillé : police semi-bold et espacement lettrage -->
          <span
            class="mt-5 text-sm font-semibold text-slate-700 tracking-wider animate-pulse"
          >
            Chargement en cours...
          </span>
        </div>
      </div>
    } @else {
    @if (error()) {
    <div class="pb-6">
      <app-alert variant="error" [message]="errorMessage()"></app-alert>
    </div>
    }

    <div class="flex flex-row justify-center items-center mb-3">
      <!-- Reçu de paiement -->
      <div class="">
        <div class="p-2">
          @if (recuPaiementFilePreview) { <img class="p-1  w-[100px] h-[100px]"
            [src]="recuPaiementFilePreview" /> }
          @else { <h2>Aucune image selectionner</h2>}
        </div>
        <app-label for="recupaiement">Reçu de paiement</app-label>
        <!-- Accepts image files (png,.jpg,.jpeg), PDF, Word documents -->
        <input id="recupaiement" name="recupaiement" type="file" accept=".png,.jpg,.jpeg,.pdf,.doc,.docx,.xml,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
          (change)="onChangeRecuPaiement($event)" />
      </div>

      <!-- Statut paiement -->
      <!--
      <div class="w-1/2">
        <app-label>Statut</app-label>
        <app-select
          [options]="LIST_STATUT_OPTIONS"
          placeholder="Selectionner un statut"
          (valueChange)="handleSelectStatutChange($event)"
          className="dark:bg-dark-900"></app-select>
      </div>
      -->
    </div>

    <div class="flex justify-between gap-2 mb-3">
      <!-- Locataire -->
      <div class="w-1/2">
        <app-label>Locataire</app-label>
        <app-select
          [options]="listLocataireOptions()"
          [placeholder]="
              hideSelectedLocataireInput()
                ? 'Chargement liste des locataires...'
                : 'Selectionner un locataire'
            "
          (valueChange)="handleSelectLocataireChange($event)"
          className="dark:bg-dark-900"
          [disabled]="hideSelectedLocataireInput()" />
      </div>
      <!-- Montant paiement -->
      <div class="w-1/2">
        <app-label for="input">Montant</app-label>
        <app-input-field
          type="text"
          (valueChange)="handleMontantChange($event.toString())" />
      </div>
    </div>

    <div class="flex justify-between gap-2 mb-3">
      <!-- Mois paiement -->
      <div class="w-1/2">
        <app-label>Mois</app-label>
        <app-select
          [options]="LIST_MONTHS_OPTIONS"
          placeholder="Selectionner un mois"
          (valueChange)="handleSelectMoisChange($event)"
          className="dark:bg-dark-900" />
      </div>
      <!-- Date de paiement -->
      <div class="w-1/2">
        <app-date-picker
          id="date-picker"
          label="Date de paiement"
          placeholder="Selectionner une date"
          (dateChange)="handleDatePaiementChange($event)" />

      </div>
    </div>

    <div class="flex justify-between gap-2 mb-3">
      <div class="flex items-center justify-end w-full gap-3 mt-8">
        <app-button size="sm" variant="outline" (click)="router.navigate(['/paiements'])"> Retour a la liste </app-button>
        <app-button size="sm" (click)="onAddPaiement()">
          Enregistrer
        </app-button>
      </div>
    </div>
    }
  </div>
</app-component-card>
