<div class="min-h-screen overflow-hidden xl:flex">
  <div>
    <app-sidebar></app-sidebar>
    <app-backdrop></app-backdrop>
  </div>
  <div
    class="flex-1 transition-all duration-300 ease-in-out"
    [ngClass]="{
      'xl:ml-[290px]': (isExpanded$ | async) || (isHovered$ | async),
      'xl:ml-[90px]': !(isExpanded$ | async) && !(isHovered$ | async),
      'ml-0': (isMobileOpen$ | async),
    }"
  >
    <!-- app header start -->
    <app-header />
    <!-- app header end -->

    <div class="p-4 mx-auto max-w-(--breakpoint-2xl) md:p-6">
      <!-- Loader -->
      @if (loaderService.isLoading()) {
        <!-- Overlay plein écran centré avec un flou moderne -->
        <div
          class="fixed inset-0 z-99999 flex flex-col items-center justify-center bg-slate-950/40 backdrop-blur-md"
        >
          <!-- Conteneur blanc épuré avec des ombres douces -->
          <div
            class="flex flex-col items-center p-8 rounded-2xl bg-white shadow-2xl border border-slate-100/80"
          >
            <!-- Rail de guidage (Un gris plus prononcé pour un meilleur contraste) -->
            <div
              class="relative w-64 h-2.5 bg-slate-200 rounded-full overflow-hidden"
            >
              <!-- La bille indigo avec un effet de lueur (glow) -->
              <div
                class="absolute top-0 bottom-0 w-14 bg-indigo-600 rounded-full shadow-[0_0_12px_rgba(79,70,229,0.5)] animate-ping-pong"
              ></div>
            </div>

            <!-- Texte retravaillé : police semi-bold et espacement lettrage -->
            <span
              class="mt-5 text-sm font-semibold text-slate-700 tracking-wider animate-pulse"
            >
              Chargement en cours...
            </span>
          </div>
        </div>
      }
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
